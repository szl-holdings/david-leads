# Single source of truth for external data endpoints. The nightly source-health
# probe (ops/source_health.py) reads this and alerts on any non-200 / schema drift
# BEFORE production traffic hits a dead endpoint. verified: last live-check date.
sources:
  - id: sec_efts_fts
    name: SEC EDGAR full-text search
    url: "https://efts.sec.gov/LATEST/search-index?q=%22compensation%22&forms=8-K"
    method: GET
    expect: json
    expect_keys: [hits]
    note: undocumented internal ES endpoint; no SLA — watch closely
    verified: "2026-07-06"
  - id: bls_v2_ces
    name: BLS v2 avg weekly earnings
    url: "https://api.bls.gov/publicAPI/v2/timeseries/data/CES0500000030"
    method: GET
    expect: json
    expect_keys: [Results]
    verified: "2026-07-06"
  - id: census_acs5_ny
    name: Census ACS5 (keyed)
    url: "https://api.census.gov/data/2023/acs/acs5?get=NAME,B19013_001E&for=state:36&key=${CENSUS_API_KEY}"
    method: GET
    expect: json
    note: MUST send CENSUS_API_KEY or it 302s to missing_key.html
    verified: "2026-07-06"
  - id: treasury_avg_rates
    name: Treasury FiscalData avg interest rates
    url: "https://api.fiscaldata.treasury.gov/services/api/fiscal_service/v2/accounting/od/avg_interest_rates?sort=-record_date&page%5Bsize%5D=1"
    method: GET
    expect: json
    expect_keys: [data]
    verified: "2026-07-06"
  - id: usaspending_awards
    name: USAspending contract activity
    url: "https://api.usaspending.gov/api/v2/search/spending_by_award/"
    method: POST
    body: '{"filters":{"time_period":[{"start_date":"2026-07-01","end_date":"2026-07-28"}],"award_type_codes":["A","B","C","D"],"recipient_scope":"domestic","recipient_locations":[{"country":"USA","state":"NY"}]},"fields":["Award ID","Recipient Name","Recipient UEI","Recipient Location","Award Amount","Awarding Agency","Description","generated_internal_id"],"page":1,"limit":1,"sort":"Award Amount","order":"desc","subawards":false}'
    expect: json
    expect_keys: [results, page_metadata]
    verified: "2026-07-28"
  - id: fmcsa_company_census
    name: FMCSA Company Census entity fields
    url: "https://data.transportation.gov/resource/az4n-8mr2.json?$select=dot_number,legal_name,add_date,phy_state&$where=status_code%3D%27A%27%20AND%20legal_name%20is%20not%20null&$limit=1"
    method: GET
    expect: json_array
    verified: "2026-07-28"
  - id: propublica_990
    name: ProPublica Nonprofit 990
    url: "https://projects.propublica.org/nonprofits/api/v2/search.json?state%5Bid%5D=NY"
    method: GET
    expect: json
    verified: "2026-07-06"
  - id: irs_soi_zip
    name: IRS SOI zip income CSV
    url: "https://www.irs.gov/pub/irs-soi/22zpallagi.csv"
    method: HEAD
    expect: any
    verified: "2026-07-06"
