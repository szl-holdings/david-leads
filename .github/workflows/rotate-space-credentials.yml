name: Rotate David Space credentials

on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: hf-write/space/SZLHOLDINGS/david-leads
  cancel-in-progress: false

jobs:
  rotate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: david-space-credential-rotation
    env:
      SPACE_ID: SZLHOLDINGS/david-leads
      SPACE_BASE_URL: https://szlholdings-david-leads.hf.space
      SOURCE_SHA: ${{ github.sha }}
    steps:
      - name: Require encrypted rotation inputs
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          DAVID_USER: ${{ secrets.DAVID_USER }}
          DAVID_PASS: ${{ secrets.DAVID_PASS }}
          DAVID_ACCESS_KEY: ${{ secrets.DAVID_ACCESS_KEY }}
          DAVID_DATABASE_URL: ${{ secrets.DAVID_DATABASE_URL }}
          DAVID_DATASET_READ_TOKEN: ${{ secrets.DAVID_DATASET_READ_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          for name in HF_TOKEN DAVID_USER DAVID_PASS DAVID_ACCESS_KEY DAVID_DATABASE_URL DAVID_DATASET_READ_TOKEN; do
            value="${!name:-}"
            if [ -z "$value" ]; then
              echo "::error::Missing protected environment secret: $name"
              exit 1
            fi
            echo "::add-mask::$value"
          done

      - name: Check out exact protected source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install exact supported clients
        run: >-
          python3 -m pip install --disable-pip-version-check
          "huggingface_hub==2.1.1"
          "requests==2.32.5"

      - name: Rotate and verify authentication
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          DAVID_USER: ${{ secrets.DAVID_USER }}
          DAVID_PASS: ${{ secrets.DAVID_PASS }}
          DAVID_ACCESS_KEY: ${{ secrets.DAVID_ACCESS_KEY }}
          DAVID_DATABASE_URL: ${{ secrets.DAVID_DATABASE_URL }}
          DAVID_DATASET_READ_TOKEN: ${{ secrets.DAVID_DATASET_READ_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import time

          import requests
          from huggingface_hub import HfApi, hf_hub_download

          from ops import frontier_live_canary
          from ops.dataset_reader_rotation import (
              DATASET_ID,
              POINTER_FILES,
              RotationContractError,
              load_pointer_expectations,
              require_dataset_revision,
              require_fine_grained_role,
              require_pointer_sizes,
              require_rotation_generation,
              validate_runtime_report,
          )

          def normalized_secret(name):
              value = os.environ[name].rstrip("\r\n")
              if not value:
                  raise SystemExit(
                      f"protected environment secret is empty after line-ending normalization: {name}"
                  )
              return value

          repo_id = os.environ["SPACE_ID"]
          base_url = os.environ["SPACE_BASE_URL"].rstrip("/")
          source_sha = require_dataset_revision(os.environ["SOURCE_SHA"])
          run_id = str(os.environ.get("GITHUB_RUN_ID") or "")
          run_attempt = str(os.environ.get("GITHUB_RUN_ATTEMPT") or "")
          if not run_id.isdigit() or not run_attempt.isdigit():
              raise SystemExit("GitHub rotation run identity is unavailable")
          rotation_generation = "sha256:" + hashlib.sha256(
              f"{run_id}\0{run_attempt}\0{source_sha}".encode("utf-8")
          ).hexdigest()
          dataset_id = DATASET_ID
          hf_token = normalized_secret("HF_TOKEN")
          dataset_read_token = normalized_secret("DAVID_DATASET_READ_TOKEN")

          reader_api = HfApi(token=dataset_read_token)
          reader_identity = reader_api.whoami(token=dataset_read_token)
          reader_role = require_fine_grained_role(reader_identity)
          dataset_info = reader_api.dataset_info(
              dataset_id,
              token=dataset_read_token,
          )
          dataset_revision = require_dataset_revision(dataset_info.sha)
          pointer_metadata = reader_api.get_paths_info(
              dataset_id,
              list(POINTER_FILES.values()),
              repo_type="dataset",
              revision=dataset_revision,
              token=dataset_read_token,
          )
          pointer_sizes = {}
          for entry in pointer_metadata:
              path = getattr(entry, "path", None)
              if path in pointer_sizes:
                  raise SystemExit("private dataset pointer metadata is duplicated")
              pointer_sizes[path] = getattr(entry, "size", None)
          require_pointer_sizes(pointer_sizes)
          pointer_paths = {}
          for source_id, filename in POINTER_FILES.items():
              pointer_paths[source_id] = hf_hub_download(
                  repo_id=dataset_id,
                  filename=filename,
                  repo_type="dataset",
                  revision=dataset_revision,
                  token=dataset_read_token,
              )
          pointer_expectations = load_pointer_expectations(pointer_paths)

          credentials = {
              "DAVID_USER": normalized_secret("DAVID_USER"),
              "DAVID_PASS": normalized_secret("DAVID_PASS"),
              "DAVID_ACCESS_KEY": normalized_secret("DAVID_ACCESS_KEY"),
          }
          space_secrets = {
              **credentials,
              "DAVID_DATABASE_URL": normalized_secret("DAVID_DATABASE_URL"),
              "DAVID_DATASET_READ_TOKEN": dataset_read_token,
          }
          rotation_order = (
              "DAVID_DATASET_READ_TOKEN",
              "DAVID_DATABASE_URL",
              "DAVID_ACCESS_KEY",
              "DAVID_PASS",
              "DAVID_USER",
          )
          revoked_fingerprint = (
              "3377808eda65b578cac8927ff49cf9d511dafe83b81ce8780905cc96641e3abd"
          )
          material = "\0".join(
              credentials[name]
              for name in ("DAVID_USER", "DAVID_PASS", "DAVID_ACCESS_KEY")
          ).encode("utf-8")
          if hashlib.sha256(material).hexdigest() == revoked_fingerprint:
              raise SystemExit("replacement values match the revoked public credential fingerprint")

          api = HfApi(token=hf_token)
          api.whoami(token=hf_token)
          for key in rotation_order:
              api.add_space_secret(
                  repo_id,
                  key=key,
                  value=space_secrets[key],
                  description="Rotated by protected GitHub workflow",
                  token=hf_token,
              )
          # The final non-secret mutation is loaded only by the successor
          # process. A stale process cannot echo this per-run generation.
          api.add_space_variable(
              repo_id,
              key="DAVID_ROTATION_GENERATION",
              value=rotation_generation,
              description="Non-secret protected rotation generation",
              token=hf_token,
          )
          # Hugging Face restarts the app after each secret update. Do not add
          # a competing explicit restart after the final mutation.

          health_url = f"{base_url}/healthz"
          health = None
          session_token = None
          last_health_status = None
          last_authentication_state = "UNAVAILABLE"
          last_persistence_state = "UNAVAILABLE"
          last_rotation_generation = None
          last_login_status = None
          last_error_class = None
          authentication_deadline = time.monotonic() + 420
          while time.monotonic() < authentication_deadline:
              last_error_class = None
              try:
                  response = requests.get(health_url, timeout=15)
                  last_health_status = response.status_code
                  if response.status_code in {200, 503}:
                      candidate = response.json()
                      last_authentication_state = candidate.get(
                          "authentication", "UNAVAILABLE"
                      )
                      last_persistence_state = candidate.get(
                          "deal_desk_persistence", "UNAVAILABLE"
                      )
                      last_rotation_generation = candidate.get("rotation_generation")
                      if (
                          candidate.get("authentication") == "CONFIGURED"
                          and last_rotation_generation == rotation_generation
                      ):
                          login = requests.post(
                              f"{base_url}/api/login",
                              json={
                                  "username": credentials["DAVID_USER"],
                                  "password": credentials["DAVID_PASS"],
                                  "access_key": credentials["DAVID_ACCESS_KEY"],
                              },
                              timeout=20,
                          )
                          last_login_status = login.status_code
                          if login.status_code == 200:
                              login_payload = login.json()
                              candidate_token = login_payload.get("token")
                              try:
                                  require_rotation_generation(
                                      login_payload.get("rotation_generation"),
                                      rotation_generation,
                                  )
                              except RotationContractError as exc:
                                  last_error_class = type(exc).__name__
                              else:
                                  if not isinstance(candidate_token, str) or not candidate_token:
                                      last_error_class = "LoginTokenUnavailable"
                                      time.sleep(10)
                                      continue
                                  health = candidate
                                  session_token = candidate_token
                                  break
              except (requests.RequestException, ValueError) as exc:
                  last_error_class = type(exc).__name__
              time.sleep(10)
          if health is None:
              timeout_diagnostics = {
                  "schema": "szl.david-space-credential-rotation-timeout/v1",
                  "space": repo_id,
                  "health_http_status": last_health_status,
                  "authentication": last_authentication_state,
                  "deal_desk_persistence": last_persistence_state,
                  "dataset_reader_preflight_verified": True,
                  "expected_rotation_generation": rotation_generation,
                  "observed_rotation_generation": last_rotation_generation,
                  "login_http_status": last_login_status,
                  "error_class": last_error_class,
                  "credential_values_recorded": False,
              }
              raise SystemExit(
                  "Space did not accept replacement credentials before timeout: "
                  + json.dumps(timeout_diagnostics, sort_keys=True)
              )
          logout = requests.post(
              f"{base_url}/api/logout",
              headers={"Authorization": f"Bearer {session_token}"},
              timeout=20,
          )
          if logout.status_code != 200:
              raise SystemExit(f"replacement credential logout failed with HTTP {logout.status_code}")

          runtime_evidence = None
          last_runtime_error_class = None
          runtime_deadline = time.monotonic() + 420
          while time.monotonic() < runtime_deadline:
              try:
                  runtime_report = frontier_live_canary.run(
                      source_sha,
                      rotation_generation,
                  )
                  runtime_evidence = validate_runtime_report(
                      runtime_report,
                      expected_source_revision=source_sha,
                      expected_rotation_generation=rotation_generation,
                      dataset_revision=dataset_revision,
                      pointer_expectations=pointer_expectations,
                  )
                  break
              except Exception as exc:
                  last_runtime_error_class = type(exc).__name__
              time.sleep(15)
          if runtime_evidence is None:
              runtime_timeout = {
                  "schema": "szl.david-dataset-reader-runtime-timeout/v1",
                  "space": repo_id,
                  "source_revision": source_sha,
                  "dataset_revision": dataset_revision,
                  "error_class": last_runtime_error_class,
                  "credential_values_recorded": False,
              }
              raise SystemExit(
                  "Space did not converge on the private dataset reader: "
                  + json.dumps(runtime_timeout, sort_keys=True)
              )

          print(
              json.dumps(
                  {
                      "schema": "szl.david-space-credential-rotation/v3",
                      "space": repo_id,
                      "updated_secret_names": sorted(space_secrets),
                      "updated_variable_names": ["DAVID_ROTATION_GENERATION"],
                      "dataset_reader": {
                          "repository": dataset_id,
                          "revision": dataset_revision,
                          "token_role": reader_role,
                          "pointer_preflight_verified": True,
                          "rotation_generation": rotation_generation,
                          "runtime": runtime_evidence,
                      },
                      "authentication": health["authentication"],
                      "deal_desk_persistence": health.get(
                          "deal_desk_persistence", "UNAVAILABLE"
                      ),
                      "persistence_ready": (
                          health.get("deal_desk_persistence") == "POSTGRES_READY"
                      ),
                      "replacement_login_verified": True,
                      "replacement_logout_verified": True,
                      "credential_values_recorded": False,
                  },
                  sort_keys=True,
              )
          )
          PY
