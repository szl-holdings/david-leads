name: Bootstrap David Leads Hugging Face flagship

# One-purpose recovery gate: recreate the deleted empty Space repository so the
# canonical exact-source publisher can populate and attest it on the next main
# revision. This workflow never uploads application code.

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/hf-restore-bootstrap.yml"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: bootstrap-david-leads-hf-flagship
  cancel-in-progress: false

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_HUB_DISABLE_TELEMETRY: "1"
    steps:
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install pinned Hugging Face client
        run: python -m pip install --disable-pip-version-check --no-cache-dir "huggingface_hub==1.23.0"

      - name: Create public Docker Space repository
        shell: bash
        run: |
          set -euo pipefail
          test -n "${HF_TOKEN:-}" || { echo "::error::HF_TOKEN absent"; exit 2; }
          echo "::add-mask::$HF_TOKEN"
          python - <<'PY'
          import json
          import os
          from huggingface_hub import HfApi

          repo_id = "SZLHOLDINGS/david-leads"
          api = HfApi(token=os.environ["HF_TOKEN"])
          identity = api.whoami(token=os.environ["HF_TOKEN"])
          identity_name = str(identity.get("name") or identity.get("fullname") or "")
          if identity_name.lower() != "betterwithage":
              raise SystemExit(
                  f"wrong Hugging Face identity: expected betterwithage, got {identity_name!r}"
              )

          api.create_repo(
              repo_id=repo_id,
              repo_type="space",
              private=False,
              space_sdk="docker",
              exist_ok=True,
          )
          api.update_repo_settings(
              repo_id=repo_id,
              repo_type="space",
              private=False,
          )
          info = api.repo_info(repo_id=repo_id, repo_type="space")
          result = {
              "repo_id": repo_id,
              "private": bool(info.private),
              "sha": str(info.sha or ""),
              "identity": identity_name,
              "state": "EMPTY_REPOSITORY_READY_FOR_EXACT_SOURCE_PUBLISHER",
          }
          if result["private"]:
              raise SystemExit("bootstrapped David Leads Space is unexpectedly private")
          print("DAVID FLAGSHIP BOOTSTRAP " + json.dumps(result, sort_keys=True))
          PY
