name: David frontier live-lanes canary

on:
  pull_request:
    paths:
      - "app/frontier_sources.py"
      - "app/echo_snapshot.py"
      - "app/federal_snapshot.py"
      - "app/benefit_frontier.py"
      - "app/server.py"
      - "ops/frontier_live_canary.py"
      - "tests/test_frontier_live_canary.py"
      - ".github/workflows/frontier-live-canary.yml"
  push:
    branches: [main]
    paths:
      - "ops/frontier_live_canary.py"
      - "tests/test_frontier_live_canary.py"
      - ".github/workflows/frontier-live-canary.yml"
  workflow_run:
    workflows: ["Deploy to HuggingFace Space"]
    types: [completed]
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: david-frontier-live-canary-${{ github.event.workflow_run.head_sha || github.ref }}
  cancel-in-progress: false

jobs:
  live-lanes:
    name: Prove four federal lanes through deployed runtime
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      EXPECTED_REVISION: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || '' }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Check out canary contract
        # The canary code comes from this repository's own commit for the event;
        # the deployed revision under test is EXPECTED_REVISION (data, never a
        # checkout ref), which keeps Scorecard's DangerousWorkflow check clean.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Verify canary's fail-closed and data-minimization contract
        run: python3 -m unittest tests.test_frontier_live_canary -v

      - name: Probe exact public runtime and four federal lanes
        # A pull request proves its contract locally; deployment completion proves
        # that exact contract against the newly published production revision.
        if: github.event_name != 'pull_request' && github.event_name != 'push'
        shell: bash
        run: |
          set -euo pipefail
          args=(--output david-frontier-live-canary.json)
          if [ -n "$EXPECTED_REVISION" ]; then
            args+=(--expected-revision "$EXPECTED_REVISION")
          fi
          python3 ops/frontier_live_canary.py "${args[@]}"

      - name: Upload immutable aggregate canary evidence
        if: always() && github.event_name != 'pull_request' && github.event_name != 'push'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: david-frontier-live-canary-${{ github.run_id }}-${{ github.run_attempt }}
          path: david-frontier-live-canary.json
          if-no-files-found: warn
          retention-days: 90
