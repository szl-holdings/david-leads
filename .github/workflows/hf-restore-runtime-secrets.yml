name: Restore David Leads Space runtime

# One-purpose recovery workflow. Deleting and recreating the Hugging Face Space
# removed its runtime secrets even though the application bytes were restored.
# This gate copies only the named protected-environment values back to the Space,
# verifies public-read-only mode, Postgres readiness, and replacement login, and
# never prints credential values.

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/hf-restore-runtime-secrets.yml"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: restore-david-leads-space-runtime
  cancel-in-progress: false

jobs:
  restore:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment:
      name: david-space-credential-rotation
    env:
      SPACE_ID: SZLHOLDINGS/david-leads
      SPACE_BASE_URL: https://szlholdings-david-leads.hf.space
    steps:
      - name: Require protected restoration inputs
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          DAVID_USER: ${{ secrets.DAVID_USER }}
          DAVID_PASS: ${{ secrets.DAVID_PASS }}
          DAVID_ACCESS_KEY: ${{ secrets.DAVID_ACCESS_KEY }}
          DAVID_DATABASE_URL: ${{ secrets.DAVID_DATABASE_URL }}
        shell: bash
        run: |
          set -euo pipefail
          for name in HF_TOKEN DAVID_USER DAVID_PASS DAVID_ACCESS_KEY DAVID_DATABASE_URL; do
            value="${!name:-}"
            if [ -z "$value" ]; then
              echo "::error::Missing protected environment secret: $name"
              exit 1
            fi
            echo "::add-mask::$value"
          done

      - name: Install pinned supported clients
        run: >-
          python3 -m pip install --disable-pip-version-check --no-cache-dir
          "huggingface_hub==1.23.0"
          "requests==2.32.5"

      - name: Restore secrets and verify the fail-closed runtime
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          DAVID_USER: ${{ secrets.DAVID_USER }}
          DAVID_PASS: ${{ secrets.DAVID_PASS }}
          DAVID_ACCESS_KEY: ${{ secrets.DAVID_ACCESS_KEY }}
          DAVID_DATABASE_URL: ${{ secrets.DAVID_DATABASE_URL }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import time

          import requests
          from huggingface_hub import HfApi

          def protected(name: str) -> str:
              value = os.environ[name].rstrip("\r\n")
              if not value:
                  raise SystemExit(
                      f"protected environment secret is empty after normalization: {name}"
                  )
              return value

          repo_id = os.environ["SPACE_ID"]
          base_url = os.environ["SPACE_BASE_URL"].rstrip("/")
          hf_token = protected("HF_TOKEN")
          credentials = {
              "DAVID_USER": protected("DAVID_USER"),
              "DAVID_PASS": protected("DAVID_PASS"),
              "DAVID_ACCESS_KEY": protected("DAVID_ACCESS_KEY"),
          }
          secrets = {
              "DAVID_DATABASE_URL": protected("DAVID_DATABASE_URL"),
              **credentials,
          }

          revoked_fingerprint = (
              "3377808eda65b578cac8927ff49cf9d511dafe83b81ce8780905cc96641e3abd"
          )
          credential_material = "\0".join(
              credentials[name]
              for name in ("DAVID_USER", "DAVID_PASS", "DAVID_ACCESS_KEY")
          ).encode("utf-8")
          if hashlib.sha256(credential_material).hexdigest() == revoked_fingerprint:
              raise SystemExit(
                  "protected values match the revoked public credential fingerprint"
              )

          api = HfApi(token=hf_token)
          identity = api.whoami(token=hf_token)
          identity_name = str(identity.get("name") or identity.get("fullname") or "")
          if identity_name.lower() != "betterwithage":
              raise SystemExit(
                  f"wrong Hugging Face identity: expected betterwithage, got {identity_name!r}"
              )

          info = api.repo_info(repo_id=repo_id, repo_type="space")
          if bool(info.private):
              api.update_repo_settings(
                  repo_id=repo_id,
                  repo_type="space",
                  private=False,
              )

          for key in (
              "DAVID_DATABASE_URL",
              "DAVID_ACCESS_KEY",
              "DAVID_PASS",
              "DAVID_USER",
          ):
              api.add_space_secret(
                  repo_id,
                  key=key,
                  value=secrets[key],
                  description="Restored by protected GitHub recovery workflow",
                  token=hf_token,
              )

          # Non-secret policy state is restored explicitly. The application also
          # defaults to public_readonly, but recording the variable prevents drift.
          api.add_space_variable(
              repo_id,
              key="DAVID_ACCESS_MODE",
              value="public_readonly",
              description="Public sanitized research view; operator writes stay authenticated",
              token=hf_token,
          )

          health = None
          session_token = None
          diagnostics = {
              "health_http_status": None,
              "ready_http_status": None,
              "authentication": "UNAVAILABLE",
              "deal_desk_persistence": "UNAVAILABLE",
              "login_http_status": None,
              "runtime_stage": "UNKNOWN",
              "error_class": None,
          }
          deadline = time.monotonic() + 1200
          while time.monotonic() < deadline:
              diagnostics["error_class"] = None
              try:
                  runtime = api.get_space_runtime(repo_id=repo_id)
                  stage_value = getattr(runtime, "stage", None)
                  diagnostics["runtime_stage"] = str(
                      getattr(stage_value, "value", stage_value) or "UNKNOWN"
                  ).upper()
                  health_response = requests.get(
                      f"{base_url}/healthz",
                      timeout=20,
                  )
                  ready_response = requests.get(
                      f"{base_url}/readyz",
                      timeout=20,
                  )
                  diagnostics["health_http_status"] = health_response.status_code
                  diagnostics["ready_http_status"] = ready_response.status_code
                  if health_response.status_code in {200, 503}:
                      candidate = health_response.json()
                      diagnostics["authentication"] = candidate.get(
                          "authentication", "UNAVAILABLE"
                      )
                      diagnostics["deal_desk_persistence"] = candidate.get(
                          "deal_desk_persistence", "UNAVAILABLE"
                      )
                      if (
                          health_response.status_code == 200
                          and ready_response.status_code == 200
                          and candidate.get("authentication") == "CONFIGURED"
                          and candidate.get("deal_desk_persistence")
                          == "POSTGRES_READY"
                      ):
                          login = requests.post(
                              f"{base_url}/api/login",
                              json={
                                  "username": credentials["DAVID_USER"],
                                  "password": credentials["DAVID_PASS"],
                                  "access_key": credentials["DAVID_ACCESS_KEY"],
                              },
                              timeout=20,
                          )
                          diagnostics["login_http_status"] = login.status_code
                          if login.status_code == 200:
                              token = login.json().get("token")
                              if isinstance(token, str) and token:
                                  health = candidate
                                  session_token = token
                                  break
              except (requests.RequestException, ValueError) as error:
                  diagnostics["error_class"] = type(error).__name__
              time.sleep(10)

          if health is None or session_token is None:
              raise SystemExit(
                  "David Leads runtime restoration did not converge: "
                  + json.dumps(diagnostics, sort_keys=True)
              )

          logout = requests.post(
              f"{base_url}/api/logout",
              headers={"Authorization": f"Bearer {session_token}"},
              timeout=20,
          )
          if logout.status_code != 200:
              raise SystemExit(
                  f"replacement credential logout failed with HTTP {logout.status_code}"
              )

          final_info = api.repo_info(repo_id=repo_id, repo_type="space")
          final_runtime = api.get_space_runtime(repo_id=repo_id)
          final_stage_value = getattr(final_runtime, "stage", None)
          final_stage = str(
              getattr(final_stage_value, "value", final_stage_value) or "UNKNOWN"
          ).upper()
          result = {
              "schema": "szl.david-space-runtime-restoration/v1",
              "status": "PASS",
              "space": repo_id,
              "identity": identity_name,
              "hub_revision": str(final_info.sha or ""),
              "private": bool(final_info.private),
              "runtime_stage": final_stage,
              "updated_secret_names": sorted(secrets),
              "updated_variable_names": ["DAVID_ACCESS_MODE"],
              "authentication": health["authentication"],
              "deal_desk_persistence": health["deal_desk_persistence"],
              "replacement_login_verified": True,
              "replacement_logout_verified": True,
              "credential_values_recorded": False,
          }
          if result["private"] or final_stage != "RUNNING":
              raise SystemExit(
                  "restored Space failed final topology check: "
                  + json.dumps(result, sort_keys=True)
              )
          print("DAVID SPACE RUNTIME RESTORED " + json.dumps(result, sort_keys=True))
          PY
