name: Migrate David Neon persistence

on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: david-neon-persistence-migration
  cancel-in-progress: false

jobs:
  migrate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: david-space-credential-rotation
    steps:
      - name: Checkout protected main
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Require protected migration credential
        env:
          DAVID_DATABASE_ADMIN_URL: ${{ secrets.DAVID_DATABASE_ADMIN_URL }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main" || {
            echo "::error::Persistence migration may run only from protected main"
            exit 1
          }
          if [ -z "${DAVID_DATABASE_ADMIN_URL:-}" ]; then
            echo "::error::Missing protected environment secret: DAVID_DATABASE_ADMIN_URL"
            exit 1
          fi
          echo "::add-mask::$DAVID_DATABASE_ADMIN_URL"

      - name: Install exact database client
        run: >-
          python3 -m pip install --disable-pip-version-check
          "psycopg[binary]==3.2.9"

      - name: Apply versioned schema in one transaction
        env:
          DAVID_DATABASE_ADMIN_URL: ${{ secrets.DAVID_DATABASE_ADMIN_URL }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          import psycopg
          from psycopg.conninfo import conninfo_to_dict

          dsn = os.environ["DAVID_DATABASE_ADMIN_URL"]
          try:
              fields = conninfo_to_dict(dsn)
          except Exception:
              raise SystemExit("admin URL is not valid PostgreSQL connection information")
          hostname = str(fields.get("host") or "").lower().rstrip(".")
          if not hostname.endswith(".neon.tech"):
              raise SystemExit("admin URL host is not a Neon endpoint")
          if str(fields.get("dbname") or "") != "neondb":
              raise SystemExit("admin URL must select the neondb database")
          if str(fields.get("sslmode") or "") not in {"require", "verify-ca", "verify-full"}:
              raise SystemExit("admin URL must require TLS")

          schema_path = Path("app/dealdesk_schema.sql")
          schema_bytes = schema_path.read_bytes()
          statements = [
              statement.strip()
              for statement in schema_bytes.decode("utf-8").split(";")
              if statement.strip()
          ]
          try:
              with psycopg.connect(dsn, connect_timeout=8) as connection:
                  with connection.cursor() as cursor:
                      cursor.execute("SET LOCAL statement_timeout = '5000ms'")
                      for statement in statements:
                          cursor.execute(statement)
                      cursor.execute(
                          "SELECT schema_version FROM david_dealdesk_schema "
                          "WHERE schema_name = %s",
                          ("dealdesk",),
                      )
                      if cursor.fetchone() != (1,):
                          raise RuntimeError("unsupported schema version")
          except Exception:
              raise SystemExit("versioned Neon schema migration failed")

          print(
              json.dumps(
                  {
                      "schema": "szl.david-neon-migration/v1",
                      "migration": "VERIFIED",
                      "schema_sha256": hashlib.sha256(schema_bytes).hexdigest(),
                      "credential_values_recorded": False,
                  },
                  sort_keys=True,
              )
          )
          PY
