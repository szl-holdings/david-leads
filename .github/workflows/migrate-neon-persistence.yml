name: Migrate David Neon persistence

on:
  workflow_call: {}
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: david-neon-persistence-migration
  cancel-in-progress: false

jobs:
  migrate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: david-space-credential-rotation
    steps:
      - name: Checkout protected main
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Require protected migration credential
        env:
          DAVID_DATABASE_ADMIN_URL: ${{ secrets.DAVID_DATABASE_ADMIN_URL }}
          DAVID_DATABASE_URL: ${{ secrets.DAVID_DATABASE_URL }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main" || {
            echo "::error::Persistence migration may run only from protected main"
            exit 1
          }
          if [ -z "${DAVID_DATABASE_ADMIN_URL:-}" ]; then
            echo "::error::Missing protected environment secret: DAVID_DATABASE_ADMIN_URL"
            exit 1
          fi
          if [ -z "${DAVID_DATABASE_URL:-}" ]; then
            echo "::error::Missing protected environment secret: DAVID_DATABASE_URL"
            exit 1
          fi
          echo "::add-mask::$DAVID_DATABASE_ADMIN_URL"
          echo "::add-mask::$DAVID_DATABASE_URL"

      - name: Install exact database client
        run: >-
          python3 -m pip install --disable-pip-version-check
          "psycopg[binary]==3.2.9"

      - name: Apply versioned schema in one transaction
        env:
          DAVID_DATABASE_ADMIN_URL: ${{ secrets.DAVID_DATABASE_ADMIN_URL }}
          DAVID_DATABASE_URL: ${{ secrets.DAVID_DATABASE_URL }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          import psycopg
          from psycopg import sql
          from psycopg.conninfo import conninfo_to_dict

          def validated_fields(value, label):
              try:
                  fields = conninfo_to_dict(value)
              except Exception:
                  raise SystemExit(
                      f"{label} URL is not valid PostgreSQL connection information"
                  )
              if fields.get("hostaddr"):
                  raise SystemExit(f"{label} URL must not override its host address")
              hostnames = [
                  member.strip().lower().rstrip(".")
                  for member in str(fields.get("host") or "").split(",")
              ]
              if not hostnames or any(
                  not hostname or not hostname.endswith(".neon.tech")
                  for hostname in hostnames
              ):
                  raise SystemExit(f"every {label} URL host must be a Neon endpoint")
              if str(fields.get("dbname") or "") != "neondb":
                  raise SystemExit(f"{label} URL must select the neondb database")
              if str(fields.get("sslmode") or "") not in {
                  "require",
                  "verify-ca",
                  "verify-full",
              }:
                  raise SystemExit(f"{label} URL must require TLS")
              return fields

          admin_dsn = os.environ["DAVID_DATABASE_ADMIN_URL"]
          runtime_dsn = os.environ["DAVID_DATABASE_URL"]
          validated_fields(admin_dsn, "admin")
          runtime_fields = validated_fields(runtime_dsn, "runtime")
          runtime_role = str(runtime_fields.get("user") or "")
          if not runtime_role:
              raise SystemExit("runtime URL must identify its least-privilege role")

          schema_path = Path("app/dealdesk_schema.sql")
          schema_bytes = schema_path.read_bytes()
          statements = [
              statement.strip()
              for statement in schema_bytes.decode("utf-8").split(";")
              if statement.strip()
          ]
          try:
              with psycopg.connect(admin_dsn, connect_timeout=8) as connection:
                  with connection.cursor() as cursor:
                      cursor.execute("SET LOCAL statement_timeout = '5000ms'")
                      for statement in statements:
                          cursor.execute(statement)
                      cursor.execute("SELECT current_schema()")
                      schema_name = cursor.fetchone()[0]
                      cursor.execute(
                          sql.SQL("GRANT USAGE ON SCHEMA {} TO {}").format(
                              sql.Identifier(schema_name),
                              sql.Identifier(runtime_role),
                          )
                      )
                      for table_name, privileges in (
                          ("david_dealdesk_schema", "SELECT"),
                          ("david_dealdesk_state", "SELECT, INSERT, UPDATE"),
                          ("david_dealdesk_events", "SELECT, INSERT"),
                      ):
                          cursor.execute(
                              sql.SQL("GRANT {} ON TABLE {}.{} TO {}").format(
                                  sql.SQL(privileges),
                                  sql.Identifier(schema_name),
                                  sql.Identifier(table_name),
                                  sql.Identifier(runtime_role),
                              )
                          )
                      cursor.execute(
                          "SELECT schema_version FROM david_dealdesk_schema "
                          "WHERE schema_name = %s",
                          ("dealdesk",),
                      )
                      if cursor.fetchone() != (1,):
                          raise RuntimeError("unsupported schema version")
          except Exception:
              raise SystemExit("versioned Neon schema migration failed")

          print(
              json.dumps(
                  {
                      "schema": "szl.david-neon-migration/v1",
                      "migration": "VERIFIED",
                      "schema_sha256": hashlib.sha256(schema_bytes).hexdigest(),
                      "credential_values_recorded": False,
                  },
                  sort_keys=True,
              )
          )
          PY
