name: Migrate David Neon persistence

on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: david-neon-persistence-migration
  cancel-in-progress: false

jobs:
  migrate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: david-space-credential-rotation
    steps:
      - name: Checkout protected main
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Require protected migration credentials
        env:
          DAVID_DATABASE_ADMIN_URL: ${{ secrets.DAVID_DATABASE_ADMIN_URL }}
          DAVID_DATABASE_URL: ${{ secrets.DAVID_DATABASE_URL }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main" || {
            echo "::error::Persistence migration may run only from protected main"
            exit 1
          }
          if [ -z "${DAVID_DATABASE_ADMIN_URL:-}" ]; then
            echo "::error::Missing protected environment secret: DAVID_DATABASE_ADMIN_URL"
            exit 1
          fi
          if [ -z "${DAVID_DATABASE_URL:-}" ]; then
            echo "::error::Missing protected environment secret: DAVID_DATABASE_URL"
            exit 1
          fi
          echo "::add-mask::$DAVID_DATABASE_ADMIN_URL"
          echo "::add-mask::$DAVID_DATABASE_URL"

      - name: Install exact database client
        run: >-
          python3 -m pip install --disable-pip-version-check
          "psycopg[binary]==3.2.9"

      - name: Apply and verify versioned schema in one transaction
        env:
          DAVID_DATABASE_ADMIN_URL: ${{ secrets.DAVID_DATABASE_ADMIN_URL }}
          DAVID_DATABASE_URL: ${{ secrets.DAVID_DATABASE_URL }}
        run: python3 .github/scripts/migrate_neon_persistence.py
