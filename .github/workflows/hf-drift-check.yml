name: HF Module Drift Check

# Thin caller for the canonical org drift guard. Compares every root-Dockerfile
# COPY source's git blob against the live HF Space tree (SZLHOLDINGS/david-leads)
# and, on divergence, names which side is ahead. It never auto-overwrites.
# Known/pre-existing divergences live in .github/hf-module-drift-allow.json
# (printed as warnings); any NEW drift fails the job.
#
# DEPENDS ON szl-holdings/.github#172 — `reusable-hf-module-drift-check.yml@main`
# only resolves once that PR merges to .github main.
#
# No HF write token needed (read-only compare via github.token).
#
# Intentionally NOT triggered on push. On a push to app/**, hf-deploy.yml fires
# on the same event and pushes GitHub -> the Space; this guard, running
# concurrently, samples the Space BEFORE that rebuild lands and reports a
# spurious "drift" (the very race that produced recurring false reds). The
# push-time GitHub<->Space equality is already asserted authoritatively by
# hf-deploy.yml's own post-rebuild live-vs-git sha256 attestation, so a
# push trigger here is both redundant and racy. The weekly schedule + manual
# dispatch remain the honest, race-free checks for out-of-band Space edits.

on:
  schedule:
    - cron: "37 6 * * 1"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  hf-drift:
    uses: szl-holdings/.github/.github/workflows/reusable-hf-module-drift-check.yml@47607d3149dd54c4e107d7eeb2129ebdff5d2d03
