name: CI — operational safety

# Full application safety gate: dependencies are required, application tests may
# not silently skip, public credential markers are rejected, and the governed
# opportunity/contact/receipt contracts execute on every product change.

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "tests/**"
      - "ops/**"
      - "tools/**"
      - "research/**"
      - "qa/**"
      - "*.md"
      - "*.txt"
      - "*.html"
      - "*.docx"
      - "build_portable.py"
      - "doc_build_make_doc.js"
      - "Dockerfile"
      - "requirements*.txt"
      - ".github/workflows/**"
  pull_request:
    paths:
      - "app/**"
      - "tests/**"
      - "ops/**"
      - "tools/**"
      - "research/**"
      - "qa/**"
      - "*.md"
      - "*.txt"
      - "*.html"
      - "*.docx"
      - "build_portable.py"
      - "doc_build_make_doc.js"
      - "Dockerfile"
      - "requirements*.txt"
      - ".github/workflows/**"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ci-receipt-honesty-${{ github.ref }}
  cancel-in-progress: true

jobs:
  evidence-kernel-reference:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Run 47 offline evidence-kernel tests
        run: python3 -m unittest -v tests.test_david_reference

  evidence-kernel-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: david_evidence_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d david_evidence_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DAVID_EVIDENCE_TEST_DSN: postgresql://postgres:postgres@127.0.0.1:5432/david_evidence_test
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: pip
      - name: Install application and test dependencies
        run: python3 -m pip install --requirement requirements-dev.txt
      - name: Run Postgres evidence-adapter and P1b API tests
        run: python3 -m unittest -v tests.test_david_postgres tests.test_david_p1b_api

  operational-safety:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: david_evidence_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d david_evidence_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DAVID_EVIDENCE_TEST_DSN: postgresql://postgres:postgres@127.0.0.1:5432/david_evidence_test
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: pip
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: Install application and test dependencies
        run: python3 -m pip install --requirement requirements-dev.txt
      - name: Compile application and operations modules
        run: python3 -m compileall -q app ops
      - name: Run full safety and application test suite
        run: python3 -m unittest discover -s tests -t . -p "test_*.py" -v
      - name: Run all browser-state and truth-surface regressions
        run: node --test tests/*.test.mjs
