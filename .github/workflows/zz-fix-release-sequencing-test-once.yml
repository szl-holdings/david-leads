# SPDX-License-Identifier: Apache-2.0
name: Fix release sequencing test once

"on":
  push:
    branches: [fix/david-release-safety-current-main-clean-20260904]
    paths:
      - .github/workflows/zz-fix-release-sequencing-test-once.yml
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: fix-release-sequencing-test-${{ github.ref }}
  cancel-in-progress: false

jobs:
  fix:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1
          persist-credentials: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
      - name: Align the test with the actual two-workflow authority boundary
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("tests/test_operational_safety.py")
          text = path.read_text(encoding="utf-8")
          for line in (
              '        self.assertIn("workflow_dispatch: {}", deploy_workflow)\n',
              '        self.assertIn("OWNER_DISPATCH_REQUIRES_MAIN", deploy_workflow)\n',
          ):
              if text.count(line) != 1:
                  raise SystemExit(f"expected exactly one stale deploy assertion: {line!r}")
              text = text.replace(line, "")
          anchor = '        self.assertIn("branches: [main]", migration_workflow)\n'
          addition = (
              anchor
              + '        self.assertIn("workflow_dispatch: {}", migration_workflow)\n'
              + '        self.assertIn("workflow_call: {}", migration_workflow)\n'
              + '        self.assertNotIn("workflow_dispatch: {}", deploy_workflow)\n'
          )
          if text.count(anchor) != 1:
              raise SystemExit("migration entrypoint assertion anchor mismatch")
          path.write_text(text.replace(anchor, addition), encoding="utf-8")
          PY
          python3 -m pip install --requirement requirements-dev.txt
          python3 -m compileall -q app ops
          python3 -m unittest discover -s tests -t . -p "test_*.py" -v
          git diff --check
      - name: Commit exact test correction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Lutar, Stephen P."
          git config user.email "stephenlutar2@gmail.com"
          git add tests/test_operational_safety.py
          git commit --signoff -m "test(release): separate migration and deploy entrypoints"
          git push origin "HEAD:${GITHUB_REF_NAME}"
