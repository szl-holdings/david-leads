name: Materialize David Leads static Public Experience identity once

on:
  push:
    branches:
      - fix/static-public-experience-marker-v1
    paths:
      - .github/workflows/szl-holographic-space-v2.yml

permissions:
  contents: write

concurrency:
  group: david-static-public-experience-marker-v1
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout exact execution commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: true

      - name: Require one current-main-parented workflow diff
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/fix/static-public-experience-marker-v1
          git fetch --no-tags --depth=1 origin main
          current_main="$(git rev-parse FETCH_HEAD)"
          test "$(git rev-parse HEAD^)" = "$current_main"
          mapfile -t changed < <(git diff --name-only "$current_main" HEAD)
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = .github/workflows/szl-holographic-space-v2.yml

      - name: Bind the CSS-only contract to the HTML root
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('app/static/index.html')
          text = path.read_text(encoding='utf-8')
          old = '<html lang="en">'
          new = '<html lang="en" data-szl-public-experience-v3="true" data-szl-space-holo-v2="true">'
          if new not in text:
              if text.count(old) != 1:
                  raise SystemExit('anonymous shell lacks one exact HTML root')
              text = text.replace(old, new, 1)
          if 'holo.js' in text:
              raise SystemExit('retired compatibility JavaScript must remain absent')
          if text.count('data-szl-public-experience-v3="true"') != 1:
              raise SystemExit('Public Experience marker must occur exactly once')
          if text.count('data-szl-space-holo-v2="true"') != 1:
              raise SystemExit('CSS activation marker must occur exactly once')
          path.write_text(text, encoding='utf-8')
          PY
          git show origin/main:.github/workflows/szl-holographic-space-v2.yml > .github/workflows/szl-holographic-space-v2.yml
          git diff --check
          mapfile -t changed < <(git diff --name-only origin/main)
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = app/static/index.html

      - name: Commit the permanent one-file result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Stephen Lutar'
          git config user.email 'stephenlutar2@gmail.com'
          git add app/static/index.html .github/workflows/szl-holographic-space-v2.yml
          mapfile -t staged < <(git diff --cached --name-only)
          test "${#staged[@]}" -eq 1
          test "${staged[0]}" = app/static/index.html
          git commit -m 'fix(frontend): activate static Public Experience identity' -m 'Bind the responsive CSS contract to the anonymous HTML root without loading the retired compatibility JavaScript.' -m 'Signed-off-by: Stephen Lutar <stephenlutar2@gmail.com>'
          git push origin HEAD:fix/static-public-experience-marker-v1
