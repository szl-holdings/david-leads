name: Public Experience Frontier v4

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  public-experience-frontier:
    name: Public Experience Frontier v4
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - name: Checkout product source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: target

      - name: Checkout organization UX policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: szl-holdings/.github
          ref: main
          persist-credentials: false
          path: policy

      - name: Enforce mobile/accessibility contract
        run: |
          python policy/scripts/check_public_experience_v4.py \
            target/app/static/index.html \
            target/app/static/holo.css
