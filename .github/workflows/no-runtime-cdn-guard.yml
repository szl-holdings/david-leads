name: no-runtime-cdn-guard
on:
  pull_request:
    paths:
      - 'app/static/**'
  push:
    branches: [main]
    paths:
      - 'app/static/**'
permissions:
  contents: read
jobs:
  no-runtime-cdn:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Fail if any served asset loads a runtime CDN
        run: |
          set -euo pipefail
          # Detect ACTIVE cdn references in href=/src= attributes only (comments that merely
          # name the domains for documentation are allowed). Doctrine v11: 0 runtime CDN.
          pattern='(href|src)="https?://[^"]*(cdnjs|googleapis|gstatic|unpkg|jsdelivr|ajax\.googleapis|cdn\.jsdelivr)'
          if grep -rEn "$pattern" app/static/ ; then
            echo "::error::Runtime CDN reference found in app/static/. Vendor the asset same-origin (see app/static/vendor and app/static/fonts)."
            exit 1
          fi
          echo "OK: 0 runtime CDN references in served assets."
