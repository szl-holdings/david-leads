# SPDX-License-Identifier: Apache-2.0
name: Responsive UI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  browser-layout:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - name: Install isolated browser runner
        run: |
          npm install --prefix "$RUNNER_TEMP/responsive-browser" --ignore-scripts --no-audit --no-fund playwright@1.63.0
          "$RUNNER_TEMP/responsive-browser/node_modules/.bin/playwright" install --with-deps chromium
      - name: Verify public views and the signed-out operator layout without source records
        env:
          EXPECTED_SOURCE_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
          PREVIEW_BASE_URL: http://127.0.0.1:7871
        run: |
          set -euo pipefail
          python3 -m http.server 7871 --bind 127.0.0.1 --directory app/static > "$RUNNER_TEMP/david-preview.log" 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid"' EXIT
          PLAYWRIGHT_MODULE_PATH="$RUNNER_TEMP/responsive-browser/node_modules/playwright/index.mjs" node tools/check_responsive.mjs
      - name: Retain source-bound browser observations
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: david-responsive-${{ github.run_id }}-${{ github.run_attempt }}
          path: reports/responsive-ui/
          if-no-files-found: error
          retention-days: 30
