name: Probe David recovery secret scope

# Read-only presence check. It never prints, hashes, compares, or transmits any
# secret value. This determines whether repository/organization secret scope can
# support the already approved recovery while the environment-gated run waits.

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/hf-recovery-secret-scope-probe.yml"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      DAVID_USER: ${{ secrets.DAVID_USER }}
      DAVID_PASS: ${{ secrets.DAVID_PASS }}
      DAVID_ACCESS_KEY: ${{ secrets.DAVID_ACCESS_KEY }}
      DAVID_DATABASE_URL: ${{ secrets.DAVID_DATABASE_URL }}
    steps:
      - name: Report names present without reading values into output
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os

          names = (
              "HF_TOKEN",
              "DAVID_USER",
              "DAVID_PASS",
              "DAVID_ACCESS_KEY",
              "DAVID_DATABASE_URL",
          )
          presence = {name: bool(os.environ.get(name, "")) for name in names}
          print(
              "DAVID RECOVERY SECRET SCOPE "
              + json.dumps(
                  {
                      "schema": "szl.secret-scope-presence/v1",
                      "presence": presence,
                      "all_required_present": all(presence.values()),
                      "secret_values_recorded": False,
                  },
                  sort_keys=True,
              )
          )
          if not all(presence.values()):
              missing = sorted(name for name, present in presence.items() if not present)
              raise SystemExit(
                  "repository/organization scope is incomplete: " + ", ".join(missing)
              )
          PY
