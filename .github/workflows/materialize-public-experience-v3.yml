name: Repair David Public Experience v3 truth surface

on:
  push:
    branches:
      - automation/local-public-experience-v3-20260903
    paths:
      - .github/workflows/materialize-public-experience-v3.yml

permissions:
  contents: write

concurrency:
  group: repair-david-public-experience-v3
  cancel-in-progress: false

jobs:
  repair:
    name: Remove forbidden anonymous script binding and verify
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Check out the exact review branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: design/szl-public-experience-v3
          fetch-depth: 0

      - name: Restore product-owned anonymous-shell truth
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          index = Path('app/static/index.html')
          css = Path('app/static/holo.css')
          javascript = Path('app/static/holo.js')
          for path in (index, css, javascript):
              if not path.is_file():
                  raise SystemExit(f'missing required file: {path}')

          html = index.read_text(encoding='utf-8')
          loader = '  <script src="holo.js?v=szl-public-experience-v3" defer></script>\n'
          if loader in html:
              html = html.replace(loader, '', 1)
              index.write_text(html, encoding='utf-8')

          html = index.read_text(encoding='utf-8')
          if 'holo.css' not in html:
              raise SystemExit('active responsive CSS binding is missing')
          if 'holo.js' in html:
              raise SystemExit('legacy compatibility JavaScript remains bound to the anonymous shell')
          if 'app.js?v=kanchay-honesty-20260828' not in html:
              raise SystemExit('product-owned David application script is missing')

          css_text = css.read_text(encoding='utf-8')
          for marker in (
              'SZL Public Experience v3',
              '--szl-touch-target',
              '100dvh',
              'safe-area-inset',
              'overflow-x: clip',
              'prefers-reduced-motion',
              'forced-colors',
              '@media print',
          ):
              if marker not in css_text:
                  raise SystemExit(f'holo.css is missing {marker}')
          if css_text.count('{') != css_text.count('}'):
              raise SystemExit('holo.css has unbalanced braces')
          PY
          node --check app/static/holo.js
          git diff --check

      - name: Commit corrected review branch when required
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Lutar, Stephen P."
          git config user.email "stephenlutar2@gmail.com"
          git add app/static/index.html
          if git diff --cached --quiet; then
            echo 'David anonymous shell already preserves the product truth contract.'
            exit 0
          fi
          git commit -s -m "fix(frontend): preserve David anonymous truth surface"
          git push origin HEAD:design/szl-public-experience-v3
