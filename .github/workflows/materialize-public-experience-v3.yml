name: Finalize David Public Experience v3 source binding

on:
  push:
    branches:
      - automation/local-public-experience-v3-20260903
    paths:
      - .github/workflows/materialize-public-experience-v3.yml

permissions:
  contents: write

concurrency:
  group: finalize-david-public-experience-v3
  cancel-in-progress: false

jobs:
  finalize:
    name: Activate local runtime assets and verify the review branch
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Check out the exact review branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: design/szl-public-experience-v3
          fetch-depth: 0

      - name: Activate and verify the local Public Experience layer
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          index = Path('app/static/index.html')
          css = Path('app/static/holo.css')
          javascript = Path('app/static/holo.js')
          for path in (index, css, javascript):
              if not path.is_file():
                  raise SystemExit(f'missing required file: {path}')

          html = index.read_text(encoding='utf-8')
          loader = '  <script src="holo.js?v=szl-public-experience-v3" defer></script>\n'
          if loader.strip() not in html:
              needle = '  <script src="app.js?v=kanchay-honesty-20260828" defer></script>'
              if needle not in html:
                  raise SystemExit('David entrypoint script injection point is missing')
              html = html.replace(needle, loader + needle, 1)
              index.write_text(html, encoding='utf-8')

          html = index.read_text(encoding='utf-8')
          if 'holo.css' not in html or 'holo.js' not in html:
              raise SystemExit('entrypoint is not bound to both local assets')

          css_text = css.read_text(encoding='utf-8')
          for marker in (
              'SZL Public Experience v3',
              '--szl-touch-target',
              '100dvh',
              'safe-area-inset',
              'overflow-x: clip',
              'max-width: 479px',
              'min-width: 768px',
              'min-width: 1440px',
              'min-width: 1920px',
              'min-width: 2560px',
              'prefers-reduced-motion',
              'prefers-contrast',
              'forced-colors',
              '@media print',
          ):
              if marker not in css_text:
                  raise SystemExit(f'holo.css is missing {marker}')
          if css_text.count('{') != css_text.count('}'):
              raise SystemExit('holo.css has unbalanced braces')

          js_text = javascript.read_text(encoding='utf-8')
          for marker in (
              '__SZL_PUBLIC_EXPERIENCE_V3__',
              'szlPublicExperienceV3',
              'szlViewportTier',
              'visualViewport',
              'requestAnimationFrame',
          ):
              if marker not in js_text:
                  raise SystemExit(f'holo.js is missing {marker}')
          for prohibited in ('fetch(', 'XMLHttpRequest', 'sendBeacon', 'localStorage', 'sessionStorage', 'document.cookie'):
              if prohibited in js_text:
                  raise SystemExit(f'holo.js contains prohibited behavior: {prohibited}')
          PY
          node --check app/static/holo.js
          git diff --check

      - name: Commit the source binding when required
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Lutar, Stephen P."
          git config user.email "stephenlutar2@gmail.com"
          git add app/static/index.html
          if git diff --cached --quiet; then
            echo 'David entrypoint was already bound to the local runtime assets.'
            exit 0
          fi
          git commit -s -m "fix(frontend): activate Public Experience v3 runtime"
          git push origin HEAD:design/szl-public-experience-v3
