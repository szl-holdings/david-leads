name: Repair David release safety test

on:
  push:
    branches:
      - fix/decouple-hf-deploy-from-schema-migration-20260903
    paths:
      - ".github/workflows/repair-david-release-safety-test.yml"

permissions:
  contents: write

concurrency:
  group: repair-david-release-safety-${{ github.ref }}
  cancel-in-progress: false

jobs:
  repair:
    name: Patch stale assertions and prove the full suite
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Check out exact repair branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: pip

      - name: Install exact application and test dependencies
        run: python3 -m pip install --requirement requirements-dev.txt

      - name: Apply deterministic assertion repair
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/repair_david_release_safety_test.py
          python3 scripts/repair_david_release_safety_test.py
          python3 -m py_compile tests/test_operational_safety.py

      - name: Run complete operational and application suite
        run: |
          set -euo pipefail
          python3 -m compileall -q app ops
          python3 -m unittest discover -s tests -t . -p "test_*.py" -v
          git diff --check

      - name: Commit only the permanent test contract
        run: |
          set -euo pipefail
          git config user.name "Lutar, Stephen P."
          git config user.email "stephenlutar2@gmail.com"
          git add tests/test_operational_safety.py
          git diff --cached --check
          git commit -s -m "test(release): bind David deploy safety to exact-source admission"
          git push origin "HEAD:${GITHUB_REF_NAME}"
