name: Deploy to HuggingFace Space

# The exact file set pushed to SZLHOLDINGS/david-leads is derived from this
# repository's Dockerfile COPY sources and attested live-vs-git after rebuild.
#
# Ordinary application, dependency, and public-document changes deploy directly
# from protected main. A schema change is withheld from the direct push path,
# runs through the protected Neon migration first, and is admitted only from the
# successful workflow_run for that exact still-current main SHA.
#
# Requires the narrowly scoped publisher secret HF_TOKEN. Database credentials
# remain confined to the david-space-credential-rotation environment owned by
# the migration workflow.

on:
  push:
    branches: [main]
    paths:
      - "Dockerfile"
      - "requirements.txt"
      - "app/**"
      - "PUBLICATION_READINESS.md"
      - "PUBLIC_DATA_OPERATING_MODEL.md"
      - "SPACE_PROVENANCE.json"
      - "THIRD_PARTY_NOTICES.md"
      - "research/COMPETITIVE_SYNTHESIS_2026-08-26.md"
      - "ops/credential-rotation.md"
      - ".github/workflows/hf-deploy.yml"
      - ".github/workflows/migrate-neon-persistence.yml"
  workflow_run:
    workflows: ["Migrate David Neon persistence"]
    types: [completed]
  workflow_dispatch: {}

permissions:
  contents: read
  id-token: write
  attestations: write

concurrency:
  group: hf-deploy-${{ github.ref_name || github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  classify:
    name: Resolve one deployable protected-main source
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      source_sha: ${{ steps.source.outputs.source_sha }}
      deploy_allowed: ${{ steps.source.outputs.deploy_allowed }}
      admission: ${{ steps.source.outputs.admission }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Check out protected history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Classify source and migration sequencing
        id: source
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before || '' }}
          WORKFLOW_CONCLUSION: ${{ github.event.workflow_run.conclusion || '' }}
          WORKFLOW_EVENT: ${{ github.event.workflow_run.event || '' }}
          WORKFLOW_BRANCH: ${{ github.event.workflow_run.head_branch || '' }}
          WORKFLOW_SHA: ${{ github.event.workflow_run.head_sha || '' }}
        shell: bash
        run: |
          set -euo pipefail
          source_sha=""
          deploy_allowed=false
          admission=REJECTED

          if [ "$EVENT_NAME" = "push" ]; then
            source_sha="$GITHUB_SHA"
            before="$BEFORE_SHA"
            if [ -z "$before" ] || [ "$before" = "0000000000000000000000000000000000000000" ]; then
              changed="$(git show --pretty='' --name-only "$source_sha")"
            else
              changed="$(git diff --name-only "$before" "$source_sha")"
            fi
            printf '%s\n' "$changed" > /tmp/david-release-changed-files.txt
            if grep -Fxq 'app/dealdesk_schema.sql' /tmp/david-release-changed-files.txt; then
              admission=WAIT_FOR_SCHEMA_MIGRATION
            else
              deploy_allowed=true
              admission=DIRECT_PROTECTED_MAIN
            fi
          elif [ "$EVENT_NAME" = "workflow_run" ]; then
            source_sha="$WORKFLOW_SHA"
            if [ "$WORKFLOW_CONCLUSION" = "success" ] \
              && [ "$WORKFLOW_EVENT" = "push" ] \
              && [ "$WORKFLOW_BRANCH" = "main" ] \
              && [ -n "$source_sha" ]; then
              current_main="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
              if [ "$source_sha" = "$current_main" ]; then
                deploy_allowed=true
                admission=SCHEMA_MIGRATION_SUCCEEDED
              else
                admission=STALE_MIGRATION_RESULT
              fi
            else
              admission=MIGRATION_NOT_ADMISSIBLE
            fi
          elif [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            source_sha="$GITHUB_SHA"
            if [ "$GITHUB_REF" = "refs/heads/main" ]; then
              deploy_allowed=true
              admission=OWNER_DISPATCH_CURRENT_MAIN
            else
              admission=OWNER_DISPATCH_REQUIRES_MAIN
            fi
          fi

          test -n "$source_sha" || {
            echo "::error::No source revision could be resolved for $EVENT_NAME"
            exit 1
          }
          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"
          echo "deploy_allowed=$deploy_allowed" >> "$GITHUB_OUTPUT"
          echo "admission=$admission" >> "$GITHUB_OUTPUT"
          echo "Source: $source_sha"
          echo "Admission: $admission"
          echo "Deploy allowed: $deploy_allowed"

  deploy:
    name: Publish exact admitted source to Hugging Face
    needs: classify
    if: needs.classify.outputs.deploy_allowed == 'true'
    uses: szl-holdings/.github/.github/workflows/reusable-hf-deploy.yml@47607d3149dd54c4e107d7eeb2129ebdff5d2d03
    secrets:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
    with:
      ref: ${{ needs.classify.outputs.source_sha }}
      include-readme: true
      source-revision-variable: SOURCE_GITHUB_SHA
      source-revision-probe-path: /api/build-info
      smoke-paths: '["/", "/healthz", "/readyz", "/api/build-info"]'

  release-receipt:
    name: Mint and publish exact-source release receipt
    needs: [classify, deploy]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Download exact deployment evidence
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: hf-deploy-evidence
          path: release-evidence

      - name: Validate and hash exact deployment manifest
        id: manifest
        env:
          SOURCE_SHA: ${{ needs.classify.outputs.source_sha }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          path = Path("release-evidence/hf-deploy-manifest.json")
          raw = path.read_bytes()
          manifest = json.loads(raw)
          expected = os.environ["SOURCE_SHA"]
          if manifest.get("schema") != 2:
              raise SystemExit("unexpected deployment-manifest schema")
          if manifest.get("github_repo") != "szl-holdings/david-leads":
              raise SystemExit("deployment manifest names the wrong GitHub repository")
          if manifest.get("hf_repo") != "SZLHOLDINGS/david-leads":
              raise SystemExit("deployment manifest names the wrong Hugging Face Space")
          if manifest.get("ref") != expected:
              raise SystemExit("deployment manifest does not bind the exact admitted main SHA")
          if manifest.get("unresolved_sources") != []:
              raise SystemExit("deployment manifest contains unresolved Docker COPY sources")
          digest = hashlib.sha256(raw).hexdigest()
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"sha256={digest}\n")
          PY

      - name: Attest exact deployment manifest with GitHub OIDC
        id: attest
        uses: actions/attest@36051bcae73b7c2a8a6945a48cbf80953c6baa35 # v4.0.0
        with:
          subject-path: release-evidence/hf-deploy-manifest.json

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Publish receipt reference and verify restarted runtime
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          SOURCE_SHA: ${{ needs.classify.outputs.source_sha }}
          MANIFEST_SHA256: ${{ steps.manifest.outputs.sha256 }}
          ATTESTATION_ID: ${{ steps.attest.outputs.attestation-id }}
          ATTESTATION_URL: ${{ steps.attest.outputs.attestation-url }}
          SPACE_ID: SZLHOLDINGS/david-leads
          SPACE_BASE_URL: https://szlholdings-david-leads.hf.space
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check \
            "huggingface_hub==1.19.0" "requests==2.32.5"
          python3 - <<'PY'
          import json
          import os
          import time
          from pathlib import Path

          import requests
          from huggingface_hub import HfApi

          token = os.environ["HF_TOKEN"].rstrip("\r\n")
          if not token:
              raise SystemExit("HF_TOKEN is not configured")
          receipt = {
              "schema": "szl.github-oidc-release-attestation/v1",
              "source_revision": os.environ["SOURCE_SHA"],
              "manifest_sha256": os.environ["MANIFEST_SHA256"],
              "attestation_id": os.environ["ATTESTATION_ID"],
              "attestation_url": os.environ["ATTESTATION_URL"],
          }
          serialized = json.dumps(receipt, sort_keys=True, separators=(",", ":"))
          HfApi(token=token).add_space_variable(
              os.environ["SPACE_ID"],
              key="RELEASE_ATTESTATION",
              value=serialized,
              description="Exact GitHub OIDC release attestation reference",
              token=token,
          )
          Path("release-evidence/release-attestation.json").write_text(
              json.dumps(receipt, indent=2) + "\n",
              encoding="utf-8",
          )

          expected = receipt
          deadline = time.monotonic() + 600
          last_state = "NO_RESPONSE"
          while time.monotonic() < deadline:
              try:
                  response = requests.get(
                      os.environ["SPACE_BASE_URL"].rstrip("/") + "/api/build-info",
                      timeout=20,
                  )
                  if response.status_code == 200:
                      body = response.json()
                      actual = body.get("release_receipt") or {}
                      last_state = str(actual.get("state") or "UNAVAILABLE")
                      if (
                          body.get("receipt_minted") is True
                          and body.get("build", {}).get("revision")
                          == expected["source_revision"]
                          and body.get("source_revision")
                          == expected["source_revision"]
                          and actual.get("source_revision")
                          == expected["source_revision"]
                          and actual.get("subject_sha256")
                          == expected["manifest_sha256"]
                          and actual.get("attestation_id")
                          == expected["attestation_id"]
                          and actual.get("attestation_url")
                          == expected["attestation_url"]
                      ):
                          Path("release-evidence/live-receipt-verification.json").write_text(
                              json.dumps(body, indent=2) + "\n",
                              encoding="utf-8",
                          )
                          break
              except (requests.RequestException, ValueError, TypeError):
                  last_state = "RESTARTING"
              time.sleep(10)
          else:
              raise SystemExit(
                  "live runtime did not expose the exact attested release receipt; "
                  f"last_state={last_state}"
              )
          PY

      - name: Upload immutable release-receipt evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: david-release-receipt
          path: |
            release-evidence/hf-deploy-manifest.json
            release-evidence/release-attestation.json
            release-evidence/live-receipt-verification.json
            ${{ steps.attest.outputs.bundle-path }}
          if-no-files-found: warn
          retention-days: 90
