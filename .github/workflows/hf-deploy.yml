name: Materialize David Hugging Face metadata repair once

on:
  push:
    branches:
      - fix/hf-space-metadata-v1
    paths:
      - .github/workflows/hf-deploy.yml

permissions:
  contents: write

concurrency:
  group: david-hf-space-metadata-v1
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout exact execution commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: true

      - name: Require one exact current-main-parented workflow diff
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/fix/hf-space-metadata-v1
          git fetch --no-tags --depth=1 origin main
          current_main="$(git rev-parse FETCH_HEAD)"
          test "$(git rev-parse HEAD^)" = "$current_main"
          mapfile -t changed < <(git diff --name-only "$current_main" HEAD)
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = .github/workflows/hf-deploy.yml

      - name: Repair and validate provider metadata
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("README.md")
          text = path.read_text(encoding="utf-8")
          old = "short_description: Official-source organization research with transparent evidence receipts"
          new = "short_description: Official-source broker research with evidence receipts"
          if new not in text:
              if text.count(old) != 1:
                  raise SystemExit("expected one exact short_description source line")
              text = text.replace(old, new, 1)
          value = next(
              line.split(":", 1)[1].strip()
              for line in text.splitlines()
              if line.startswith("short_description:")
          )
          if len(value) > 60:
              raise SystemExit(f"short_description remains too long: {len(value)}")
          if len(value) < 20:
              raise SystemExit("short_description is not informative")
          path.write_text(text, encoding="utf-8")
          print({"short_description": value, "length": len(value)})
          PY
          git show origin/main:.github/workflows/hf-deploy.yml > .github/workflows/hf-deploy.yml
          git add README.md .github/workflows/hf-deploy.yml
          git diff --cached --check
          mapfile -t staged < <(git diff --cached --name-only)
          test "${#staged[@]}" -eq 2
          printf '%s\n' "${staged[@]}" | grep -Fx .github/workflows/hf-deploy.yml
          printf '%s\n' "${staged[@]}" | grep -Fx README.md

      - name: Commit the permanent one-line metadata repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Stephen Lutar'
          git config user.email 'stephenlutar2@gmail.com'
          git commit -m 'fix(hf): satisfy Space short-description contract' -m 'Shorten the provider metadata field to 56 characters while retaining a clear product description.' -m 'Signed-off-by: Stephen Lutar <stephenlutar2@gmail.com>'
          test "$(git diff --name-only origin/main HEAD)" = README.md
          git push origin HEAD:fix/hf-space-metadata-v1
