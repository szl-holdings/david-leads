name: Deploy to HuggingFace Space

# Thin caller for the canonical org deployer. The exact file set pushed to the
# live Space (SZLHOLDINGS/david-leads) is DERIVED from this repo's root
# Dockerfile COPY sources (requirements.txt + app/), then attested live-vs-git
# (sha256) after the Space rebuilds. No hand-maintained allowlist to drift.
#
# DEPENDS ON szl-holdings/.github#172 — `reusable-hf-deploy.yml@main` only
# resolves once that PR merges to .github main. TODO: nothing to flip; @main is
# the steady state.
#
# Requires org/repo secret HF_TOKEN (HF write token, org write to SZLHOLDINGS),
# passed via `secrets: inherit`. The deployer FAILS LOUDLY if it is absent.

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "requirements.txt"
      - "Dockerfile"
      - "README.md"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: hf-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    uses: szl-holdings/.github/.github/workflows/reusable-hf-deploy.yml@47607d3149dd54c4e107d7eeb2129ebdff5d2d03
    secrets: inherit
    with:
      include-readme: true
      source-revision-variable: SOURCE_GITHUB_SHA
      source-revision-probe-path: /api/build-info
      smoke-paths: '["/", "/healthz", "/readyz", "/api/build-info"]'
