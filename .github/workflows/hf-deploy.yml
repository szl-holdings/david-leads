name: Deploy corrected David Public Experience v3 once

on:
  push:
    branches:
      - exec/public-experience-v3-20260903-v2
    paths:
      - .github/workflows/hf-deploy.yml

permissions:
  contents: read
  id-token: write
  attestations: write

concurrency:
  group: david-public-experience-v3-once
  cancel-in-progress: false

jobs:
  verify-execution:
    runs-on: ubuntu-24.04
    outputs:
      main_sha: ${{ steps.bind.outputs.main_sha }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout exact execution commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false

      - name: Bind to exact current protected main
        id: bind
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/exec/public-experience-v3-20260903-v2
          git fetch --no-tags --depth=1 origin main
          main_sha="$(git rev-parse FETCH_HEAD)"
          test "$(git rev-parse HEAD^)" = "$main_sha"
          mapfile -t changed < <(git diff --name-only "$main_sha" HEAD)
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = .github/workflows/hf-deploy.yml
          echo "main_sha=$main_sha" >> "$GITHUB_OUTPUT"

  deploy:
    needs: verify-execution
    uses: szl-holdings/.github/.github/workflows/reusable-hf-deploy.yml@47607d3149dd54c4e107d7eeb2129ebdff5d2d03
    secrets:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
    with:
      ref: ${{ needs.verify-execution.outputs.main_sha }}
      include-readme: true
      source-revision-variable: SOURCE_GITHUB_SHA
      source-revision-probe-path: /api/build-info
      smoke-paths: '["/", "/healthz", "/readyz", "/api/build-info"]'

  verify-live:
    needs: [verify-execution, deploy]
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    env:
      EXPECTED_SHA: ${{ needs.verify-execution.outputs.main_sha }}
      ORIGIN: https://szlholdings-david-leads.hf.space
      REPORT: /tmp/david-public-experience-v3-live.json
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Verify exact source and rendered activation markers
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import time
          import urllib.error
          import urllib.request
          from pathlib import Path

          origin = os.environ["ORIGIN"].rstrip("/")
          expected = os.environ["EXPECTED_SHA"].lower()
          headers = {
              "User-Agent": "SZL-David-Public-Experience-v3-Proof/1.0",
              "Cache-Control": "no-cache, no-store",
          }

          def read(path):
              request = urllib.request.Request(origin + path, headers=headers)
              try:
                  with urllib.request.urlopen(request, timeout=25) as response:
                      return response.status, response.read(1_048_577)
              except urllib.error.HTTPError as exc:
                  return exc.code, exc.read(65_536)

          deadline = time.monotonic() + 900
          result = {}
          while time.monotonic() < deadline:
              build_status, build_body = read("/api/build-info")
              root_status, root_body = read("/")
              try:
                  build = json.loads(build_body.decode("utf-8"))
              except Exception:
                  build = {}
              root = root_body.decode("utf-8", errors="replace")
              revision = str(
                  (build.get("build") or {}).get("revision")
                  or build.get("source_revision")
                  or ""
              ).lower()
              result = {
                  "expected_sha": expected,
                  "build_status": build_status,
                  "root_status": root_status,
                  "observed_revision": revision,
                  "root_sha256": hashlib.sha256(root_body).hexdigest(),
                  "public_experience_v3": 'data-szl-public-experience-v3="true"' in root,
                  "space_holo_v2": 'data-szl-space-holo-v2="true"' in root,
              }
              if (
                  build_status == 200
                  and root_status == 200
                  and revision == expected
                  and result["public_experience_v3"]
                  and result["space_holo_v2"]
              ):
                  result["ok"] = True
                  break
              time.sleep(10)
          else:
              result["ok"] = False

          Path(os.environ["REPORT"]).write_text(
              json.dumps(result, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(result, indent=2, sort_keys=True))
          if not result["ok"]:
              raise SystemExit("David Public Experience v3 live proof failed")
          PY

      - name: Upload immutable live proof
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: david-public-experience-v3-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.REPORT }}
          if-no-files-found: error
          retention-days: 90
