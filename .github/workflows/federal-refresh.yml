name: federal-refresh

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

concurrency:
  group: federal-refresh
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  echo-refresh:
    name: Verified federal refresh (${{ matrix.lane }})
    if: github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        lane: [echo, fmcsa, form5500, usaspending]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout exact parser source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Download official ECHO Exporter archive
        if: matrix.lane == 'echo'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          curl --fail --silent --show-error --location \
            --proto '=https' --proto-redir '=https' --tlsv1.2 \
            --connect-timeout 30 --max-time 1800 \
            --retry 5 --retry-delay 5 --retry-all-errors \
            --dump-header evidence/download-headers.txt \
            --output echo_exporter.zip.part \
            https://echo.epa.gov/files/echodownloads/echo_exporter.zip
          test -s echo_exporter.zip.part
          mv echo_exporter.zip.part echo_exporter.zip
          test -s echo_exporter.zip
          sha256sum echo_exporter.zip | tee evidence/source.sha256

      - name: Normalize and create standalone receipt
        if: matrix.lane == 'echo'
        shell: bash
        run: |
          set -euo pipefail
          python -m tools.ingestor.echo_ingestor_cli \
            --zip echo_exporter.zip \
            --out snapshot \
            --source-revision "$GITHUB_SHA"

      - name: Install locked application dependencies for scheduled collection
        if: matrix.lane != 'echo'
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Collect minimized official records into a scheduled snapshot
        if: matrix.lane != 'echo'
        env:
          LANE: ${{ matrix.lane }}
        run: |
          set -euo pipefail
          mkdir -p evidence
          python -m tools.ingestor.frontier_refresh_cli \
            --lane "$LANE" --out snapshot --source-revision "$GITHUB_SHA" \
            2>&1 | tee evidence/collection.log

      - name: Verify standalone receipt integrity
        id: verify_snapshot
        shell: bash
        env:
          LANE: ${{ matrix.lane }}
        run: |
          set -euo pipefail
          if [ "$LANE" = "echo" ]; then
            python -m tools.ingestor.verify_snapshot snapshot | tee evidence/verification.txt
          else
            python -c 'from pathlib import Path; from tools.ingestor.publish_snapshot import verify; raise SystemExit(verify(Path("snapshot")))' | tee evidence/verification.txt
          fi
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json

          with open("snapshot/snapshot.json", encoding="utf-8") as handle:
              print(f"digest={json.load(handle)['snapshot_digest']}")
          PY

      - name: Attest exact snapshot manifest with GitHub OIDC
        id: attest_snapshot
        uses: actions/attest@36051bcae73b7c2a8a6945a48cbf80953c6baa35 # v4.0.0
        with:
          subject-path: snapshot/snapshot.json

      - name: Record non-secret attestation reference
        env:
          ATTESTATION_ID: ${{ steps.attest_snapshot.outputs.attestation-id }}
          LANE: ${{ matrix.lane }}
          ATTESTATION_URL: ${{ steps.attest_snapshot.outputs.attestation-url }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          Path("evidence/attestation.json").write_text(
              json.dumps(
                  {
                      "attestation_id": os.environ["ATTESTATION_ID"],
                      "attestation_url": os.environ["ATTESTATION_URL"],
                      "subject": "snapshot/snapshot.json",
                  },
                  indent=2,
                  sort_keys=True,
              )
              + "\n",
              encoding="utf-8",
          )
          PY

      - name: Install pinned Hugging Face publisher
        run: >-
          python -m pip install --disable-pip-version-check --no-cache-dir
          huggingface_hub==1.19.0

      - name: Publish one atomic verified dataset commit
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$GITHUB_SHA"
          python -m tools.ingestor.publish_snapshot \
          --dataset SZLHOLDINGS/david-leads-data \
          --snapshot snapshot \
          --receipt-out publication.json

      - name: Record bounded run status
        if: ${{ always() }}
        env:
          JOB_STATUS: ${{ job.status }}
          LANE: ${{ matrix.lane }}
          SNAPSHOT_DIGEST: ${{ steps.verify_snapshot.outputs.digest }}
          ATTESTATION_ID: ${{ steps.attest_snapshot.outputs.attestation-id }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          evidence = Path("evidence")
          evidence.mkdir(exist_ok=True)
          status = {
              "workflow": "federal-refresh",
              "lane": os.environ.get("LANE", "unknown"),
              "job_status_at_evidence_step": os.environ.get("JOB_STATUS", "unknown"),
              "source_revision": os.environ.get("GITHUB_SHA", ""),
              "run_id": os.environ.get("GITHUB_RUN_ID", ""),
              "run_attempt": os.environ.get("GITHUB_RUN_ATTEMPT", ""),
              "snapshot_digest": os.environ.get("SNAPSHOT_DIGEST", ""),
              "snapshot_manifest_present": Path("snapshot/snapshot.json").is_file(),
              "snapshot_receipt_present": Path("snapshot/receipt.json").is_file(),
              "publication_receipt_present": Path("publication.json").is_file(),
              "attestation_id": os.environ.get("ATTESTATION_ID", ""),
          }
          (evidence / "run-status.json").write_text(
              json.dumps(status, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a", encoding="utf-8") as summary:
              summary.write("## Federal Refresh evidence\n\n")
              summary.write(f"- Source revision: `{status['source_revision']}`\n")
              summary.write(f"- Snapshot digest: `{status['snapshot_digest'] or 'UNAVAILABLE'}`\n")
              summary.write(f"- Publication receipt present: `{status['publication_receipt_present']}`\n")
              summary.write(f"- Attestation ID: `{status['attestation_id'] or 'UNAVAILABLE'}`\n")
          PY

      - name: Upload bounded refresh evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: federal-refresh-evidence-${{ matrix.lane }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ steps.verify_snapshot.outputs.digest }}
          path: |
            evidence/
            snapshot/snapshot.json
            snapshot/receipt.json
            publication.json
            ${{ steps.attest_snapshot.outputs.bundle-path }}
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
