name: Apply bounded Neon migration trigger repair

on:
  push:
    branches:
      - fix/scope-neon-migration-trigger-20260903
    paths:
      - .github/workflows/_prepare_neon_trigger_scope_branch.yml

permissions:
  contents: write

concurrency:
  group: apply-neon-trigger-scope-repair
  cancel-in-progress: false

jobs:
  apply:
    name: Commit exact schema-only trigger repair
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Check out exact repair branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/scope-neon-migration-trigger-20260903
          fetch-depth: 0
          persist-credentials: true

      - name: Apply and prove the bounded repair
        shell: bash
        env:
          TEST_CONTENT_B64: 
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import base64
          import os
          import re

          workflow = Path('.github/workflows/migrate-neon-persistence.yml')
          text = workflow.read_text(encoding='utf-8')
          pattern = re.compile(
              r'(?ms)^  push:\n'
              r'    branches: \[main\]\n'
              r'    paths:\n'
              r'(?:      - "[^"]+"\n)+'
              r'  workflow_call: \{\}\n'
          )
          replacement = (
              '  push:\n'
              '    branches: [main]\n'
              '    paths:\n'
              '      - "app/dealdesk_schema.sql"\n'
              '  workflow_call: {}\n'
          )
          patched, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit(f'expected one push-path block, replaced {count}')
          workflow.write_text(patched, encoding='utf-8')

          test = Path('tests/test_neon_migration_trigger_scope.py')
          test.write_bytes(base64.b64decode(os.environ['TEST_CONTENT_B64']))

          trigger = patched.split('  workflow_call: {}', 1)[0]
          if '      - "app/dealdesk_schema.sql"' not in trigger:
              raise SystemExit('schema-only trigger was not installed')
          for prohibited in ('"app/**"', '"app/static/**"', '"requirements.txt"',
                             '"Dockerfile"', '"README.md"',
                             '".github/workflows/migrate-neon-persistence.yml"'):
              if prohibited in trigger:
                  raise SystemExit(f'unrelated migration trigger survived: {prohibited}')
          if 'name: david-space-credential-rotation' not in patched:
              raise SystemExit('protected migration environment was lost')
          if 'Path("app/dealdesk_schema.sql")' not in patched:
              raise SystemExit('schema subject binding was lost')
          PY

          python -m py_compile tests/test_neon_migration_trigger_scope.py
          rm -f .github/workflows/_prepare_neon_trigger_scope_branch.yml
          git diff --check
          test "$(git status --porcelain | wc -l | tr -d ' ')" = "3"

      - name: Commit the exact reviewed scope
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          test "$(git diff --cached --name-only | wc -l | tr -d ' ')" = "3"
          git commit -s -m "fix(ci): scope Neon migration to schema changes"
          git push origin HEAD:fix/scope-neon-migration-trigger-20260903
