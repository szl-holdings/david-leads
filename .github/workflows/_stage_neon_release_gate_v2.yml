name: Stage two-stage Neon release gate

on:
  push:
    branches:
      - fix/scope-neon-migration-trigger-20260903
    paths:
      - .github/workflows/_stage_neon_release_gate_v2.yml

permissions:
  contents: write

concurrency:
  group: stage-neon-release-gate-v2
  cancel-in-progress: false

jobs:
  stage:
    name: Generate exact unprivileged-classifier architecture
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Check out exact repair branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/scope-neon-migration-trigger-20260903
          fetch-depth: 0
          persist-credentials: true

      - name: Generate and prove release-gate replacement bytes
        shell: bash
        env:
          TEST_CONTENT_B64: 
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import base64
          import os
          import re

          source = Path('.github/workflows/migrate-neon-persistence.yml')
          text = source.read_text(encoding='utf-8')

          release_paths = '''      - "app/**"
      - "requirements.txt"
      - "Dockerfile"
      - "README.md"
      - "PUBLICATION_READINESS.md"
      - "PUBLIC_DATA_OPERATING_MODEL.md"
      - "THIRD_PARTY_NOTICES.md"
      - "SPACE_PROVENANCE.json"
      - "research/COMPETITIVE_SYNTHESIS_2026-08-26.md"
      - "ops/credential-rotation.md"
      - ".github/workflows/hf-deploy.yml"
      - ".github/workflows/migrate-neon-persistence.yml"
'''
          trigger_pattern = re.compile(
              r'(?ms)^  push:\n'
              r'    branches: \[main\]\n'
              r'    paths:\n'
              r'(?:      - "[^"]+"\n)+'
              r'  workflow_call: \{\}\n'
          )
          trigger_replacement = (
              '  push:\n'
              '    branches: [main]\n'
              '    paths:\n'
              + release_paths
              + '  workflow_call: {}\n'
          )
          text, count = trigger_pattern.subn(trigger_replacement, text, count=1)
          if count != 1:
              raise SystemExit(f'expected one trigger block, replaced {count}')

          classify = '''jobs:
  classify:
    name: Classify release input before privileged migration
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      schema_changed: ${{ steps.scope.outputs.schema_changed }}
    steps:
      - name: Check out exact protected source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false

      - name: Classify schema change without provider credentials
        id: scope
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main" || {
            echo "::error::Persistence release gate may run only from protected main"
            exit 1
          }

          if [ "$GITHUB_EVENT_NAME" != "push" ]; then
            echo "schema_changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          after="$GITHUB_SHA"
          before="${BEFORE_SHA:-}"
          if [ -z "$before" ] || [[ "$before" =~ ^0+$ ]]; then
            git show --pretty='' --name-only "$after" > /tmp/david-release-paths
          else
            git fetch --no-tags --depth=1 origin "$before"
            git diff --name-only "$before" "$after" > /tmp/david-release-paths
          fi

          if grep -Fxq "app/dealdesk_schema.sql" /tmp/david-release-paths; then
            echo "schema_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "schema_changed=false" >> "$GITHUB_OUTPUT"
          fi

  migrate:
    needs: classify
    if: needs.classify.outputs.schema_changed == 'true'
'''
          text, count = re.subn(
              r"jobs:\n  migrate:\n    runs-on: ubuntu-latest\n",
              classify + '    runs-on: ubuntu-latest\n',
              text,
              count=1,
          )
          if count != 1:
              raise SystemExit(f'expected one migration job prefix, replaced {count}')

          staged = Path('staged-neon-release-gate-v2.yml')
          staged.write_text(text, encoding='utf-8')
          test = Path('tests/test_neon_migration_trigger_scope.py')
          test.write_bytes(base64.b64decode(os.environ['TEST_CONTENT_B64']))

          import yaml
          parsed = yaml.safe_load(text)
          trigger = parsed.get('on', parsed.get(True))
          assert trigger['push']['paths'][0] == 'app/**'
          assert parsed['jobs']['classify'].get('environment') is None
          assert parsed['jobs']['migrate']['needs'] == 'classify'
          assert parsed['jobs']['migrate']['if'] == "needs.classify.outputs.schema_changed == 'true'"
          assert parsed['jobs']['migrate']['environment']['name'] == 'david-space-credential-rotation'
          PY

          python -m py_compile tests/test_neon_migration_trigger_scope.py
          python -m unittest tests.test_neon_migration_trigger_scope -v
          rm -rf tests/__pycache__
          git diff --check

      - name: Commit only ordinary staging paths
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add staged-neon-release-gate-v2.yml tests/test_neon_migration_trigger_scope.py
          test "$(git diff --cached --name-only | wc -l | tr -d ' ')" = "2"
          git commit -s -m "chore(ci): stage two-stage Neon release gate bytes"
          git push origin HEAD:fix/scope-neon-migration-trigger-20260903
