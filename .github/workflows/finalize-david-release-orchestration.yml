name: Finalize David release orchestration repair

on:
  push:
    branches:
      - fix/decouple-hf-deploy-from-schema-migration-20260903
    paths:
      - ".github/workflows/finalize-david-release-orchestration.yml"

permissions:
  contents: write

concurrency:
  group: finalize-david-release-orchestration-${{ github.ref }}
  cancel-in-progress: false

jobs:
  finalize:
    name: Patch, prove, and commit test contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Check out exact repair branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Repair and prove release test ownership
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/finalize_david_release_orchestration.py
          python3 scripts/finalize_david_release_orchestration.py
          python3 -m unittest discover -s tests -p 'test_hf_deploy_release_sequencing.py' -v
          python3 -m py_compile \
            tests/test_hf_deploy_release_sequencing.py \
            tests/test_release_truth_surface.py
          git diff --check

      - name: Commit verified non-workflow test diff
        run: |
          set -euo pipefail
          git config user.name "Lutar, Stephen P."
          git config user.email "stephenlutar2@gmail.com"
          git add \
            tests/test_hf_deploy_release_sequencing.py \
            tests/test_release_truth_surface.py
          git diff --cached --check
          git commit -s -m "test(release): prove David migrate-first deploy sequencing"
          git push origin "HEAD:${GITHUB_REF_NAME}"
